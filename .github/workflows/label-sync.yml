# Label sync workflow. Lives in the .github repo and propagates labels.yml
# to every repo in the thornveil-ai org that opts in.
#
# Each opt-in repo just needs a workflow that references this org-default
# labels.yml, OR can be added to the matrix below to receive labels via PAT.

name: Label sync

on:
  push:
    branches: [main]
    paths:
      - '.github/labels.yml'
      - '.github/workflows/label-sync.yml'
  workflow_dispatch:

jobs:
  sync-this-repo:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: EndBug/label-sync@v2
        with:
          config-file: .github/labels.yml
          delete-other-labels: false

  # Propagate to all org repos. Requires a PAT with `repo` scope stored
  # as ORG_LABEL_SYNC_PAT secret. Each repo listed here gets the labels.
  # Add repos as they migrate in.
  sync-org-repos:
    runs-on: ubuntu-latest
    needs: sync-this-repo
    strategy:
      fail-fast: false
      matrix:
        repo:
          - meridian
          # Add as repos migrate to thornveil-ai:
          # - signet
          # - alchemist
          # - pyros
          # - mycelium
          # - rigrun
          # - hawkstack
          # - canopy
          # - navigator
          # - auspex
    steps:
      - uses: actions/checkout@v4
      - name: Sync labels to ${{ matrix.repo }}
        uses: EndBug/label-sync@v2
        with:
          token: ${{ secrets.ORG_LABEL_SYNC_PAT }}
          config-file: .github/labels.yml
          delete-other-labels: false
        
