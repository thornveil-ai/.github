# Label sync workflow.
#
# Acts in two modes:
#
# 1. Self-sync (push trigger): when .github/labels.yml changes here, sync those
#    labels onto this (.github) repo. No PAT needed; uses default GITHUB_TOKEN.
#
# 2. Reusable callable (workflow_call trigger): downstream org repos call this
#    workflow from their own .github/workflows/label-sync.yml to sync labels
#    from this canonical labels.yml onto themselves. Runs in the caller's
#    context, so the labels land on the caller. No PAT needed (same-org
#    workflow_call is allowed by default).
#
# When migrating a new repo to thornveil-ai, add a 10-line caller workflow to
# the new repo at .github/workflows/label-sync.yml — template:
#
#   name: Label sync
#   on:
#     schedule: [{ cron: '0 8 * * 1' }]
#     workflow_dispatch:
#   jobs:
#     sync:
#       uses: thornveil-ai/.github/.github/workflows/label-sync.yml@main
#       permissions:
#         contents: read
#         issues: write

name: Label sync

on:
  push:
    branches: [main]
    paths:
      - '.github/labels.yml'
      - '.github/workflows/label-sync.yml'
  workflow_call:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read   # required for actions/checkout on private repos
      issues: write
    steps:
      - uses: actions/checkout@v6
      - uses: EndBug/label-sync@v2
        with:
          # Always pull canonical label set from the .github repo's
          # .github/labels.yml (source-repo fetches that path by default).
          # config-file and source-repo are mutually exclusive — picking
          # source-repo so this works correctly both from self-sync (where
          # source-repo equals the runner's repo) and from reusable callers.
          source-repo: thornveil-ai/.github
          delete-other-labels: false
