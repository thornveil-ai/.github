name: Feature request
description: A new capability or enhancement
title: "[feat] "
labels: ["type: feat", "status: triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What can't be done today? Who is blocked and why?
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: What you'd like to see built. Sketch is fine.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will we know this is done?
      placeholder: |
        - [ ]
        - [ ]
        - [ ]

  - type: dropdown
    id: customer-driven
    attributes:
      label: Customer-driven?
      options:
        - "no — internal initiative"
        - "yes — SOCPAC"
        - "yes — Vanguard"
        - "yes — federal pipeline"
        - "yes — other (specify in description)"

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
