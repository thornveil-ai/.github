name: Bug Report
description: Report a defect in a Thornveil product
title: "[bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. The more detail you provide, the faster we can fix it.

        **Do not file security vulnerabilities here.** See [SECURITY.md](https://github.com/thornveil-ai/.github/blob/main/SECURITY.md) for the private reporting process.

  - type: dropdown
    id: product
    attributes:
      label: Affected Product
      description: Which Thornveil product is affected?
      options:
        - RigRun
        - Pyros
        - Mycelium
        - Agent Factory
        - Other / Multiple
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `--version` or commit SHA
      placeholder: "e.g. rigrun v1.2.3 or commit abc1234"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What Happened?
      description: A clear description of the bug.
      placeholder: Tell us what you saw...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What Did You Expect?
      description: What should have happened instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps a maintainer can follow to reproduce the issue.
      placeholder: |
        1. Run `...`
        2. Send request `...`
        3. Observe `...`
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, kernel, hardware (CPU/GPU), and any relevant config.
      placeholder: |
        - OS: Ubuntu 24.04
        - Kernel: 6.8.0
        - GPU: NVIDIA RTX 4090 (driver 550.x)
        - CUDA: 12.4
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Stack Trace
      description: Paste relevant log output. This will be automatically formatted as code.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checklist
      options:
        - label: I searched existing issues and did not find a duplicate
          required: true
        - label: This is not a security vulnerability (those go to security@thornveil.ai)
          required: true
        - label: I am running the latest released version, or have confirmed the bug exists on main
          required: false
