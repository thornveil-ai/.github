# Dependabot configuration for thornveil-ai/.github.
#
# GitHub runs this file against the .github repository itself (it is not
# inherited by other org repos), so only github-actions is enabled here.
#
# Per-repo ecosystem templates (copy relevant blocks into each repo's own
# .github/dependabot.yml):
#
#   gomod / pip / npm / cargo:
#     - package-ecosystem: "<gomod|pip|npm|cargo>"
#       directory: "/"
#       schedule:
#         interval: "weekly"
#         day: "monday"
#       open-pull-requests-limit: 5
#       commit-message:
#         prefix: "deps"
#         include: "scope"
#       labels:
#         - "type: chore"
#         - "area: deps"
#
# Mycelium override note (handled in mycelium's own dependabot.yml):
#   Alerts on; security updates DISABLED for paths under internal/mesh/.
#   Trade-secret-grade code regresses in ways tests don't always catch.
#   Every dep bump on those paths gets human eyes before merge.

version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "type: chore"
      - "area: ci"
